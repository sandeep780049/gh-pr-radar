name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install jq
        run: sudo apt-get update -y && sudo apt-get install -y jq
      - name: Run test suite
        run: ./tests/run_tests.sh
      - name: Shellcheck
        run: sudo apt-get install -y shellcheck && shellcheck gh-pr-radar
